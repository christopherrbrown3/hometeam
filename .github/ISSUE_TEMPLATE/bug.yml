name: Bug report
description: Report an observable defect in implemented behavior.
title: "bug: "
labels:
  - "type:bug"
  - "needs:acceptance-review"
body:
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security or data-isolation impact
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Environment and evidence
    validations:
      required: true

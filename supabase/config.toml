# HomeTeam local Supabase project configuration.
# Keep this file free of project credentials and use `supabase status -o env` for
# browser-safe local values after the stack starts.
project_id = "hometeam"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
# New public-schema objects stay unavailable to Data API roles until a migration
# explicitly grants access. Do not enable the legacy auto-exposure setting.

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
# Timestamped SQL files in migrations/ are the only schema source of truth.
schema_paths = []

[db.seed]
enabled = true
# Issue #12 will add deterministic development fixtures at this path.
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
enable_confirmations = false
otp_length = 6
otp_expiry = 3600

[auth.sms]
enable_signup = false
enable_confirmations = false
